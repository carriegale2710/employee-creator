# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
# https://www.baeldung.com/ops/github-actions-deploy-ec2

name: Spring App EC2 Deploy

on:
  push:
    branches: ["main"]
    paths: ["employee/**"] # Only run if something in back-end changes

  pull_request:
    branches: ["main"]
    paths: ["employee/**"]

  workflow_dispatch:

permissions:
  contents: read

env:
  JAR_NAME: employee-0.0.1-SNAPSHOT.jar
  REMOTE_DIR: /home/ubuntu/apps/employee-creator-spring
  REMOTE_JAR_NAME: employee-creator.jar
  SERVICE_NAME: employee-creator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: 🔨 Build Spring Boot application
        run: |
          cd employee
          mvn clean install -DskipTests
          echo "✅ Build completed successfully"
          ls -lh target/${{ env.JAR_NAME }}

      - name: 🚀 Deploy to EC2 via SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ubuntu # Ubuntu AMI, not Amazon Linux
        run: |
          # Save SSH key to file and set permissions
          echo "$EC2_SSH_KEY" > ec2-key.pem
          chmod 600 ec2-key.pem

          # Test SSH connectivity with timeout
          echo "🔐 Testing SSH connectivity..."
          timeout 30 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -i ec2-key.pem ${EC2_USER}@${EC2_HOST} "echo 'SSH connection successful'" || {
            echo "❌ SSH connection failed!"
            echo "Troubleshooting information:"
            echo "- Check if EC2 instance is running"
            echo "- Verify security group allows SSH (port 22) from GitHub Actions IPs"
            echo "- Confirm EC2_HOST and EC2_SSH_KEY secrets are correct"
            exit 1
          }

          # Upload JAR file straight into the app's deploy directory, using the
          # same filename the systemd unit's ExecStart expects
          echo "📦 Uploading JAR file to EC2..."
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt/3..."
            if timeout 120 scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -i ec2-key.pem \
              employee/target/${{ env.JAR_NAME }} \
              ${EC2_USER}@${EC2_HOST}:${{ env.REMOTE_DIR }}/${{ env.REMOTE_JAR_NAME }}; then
              echo "✅ JAR file uploaded successfully on attempt $attempt"
              break
            else
              echo "❌ Upload attempt $attempt failed"
              if [ $attempt -eq 3 ]; then
                echo "❌ All upload attempts failed!"
                exit 1
              fi
              echo "⏳ Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

          # Restart the app via its systemd service (DB credentials are already
          # supplied on the box via EnvironmentFile — no need to pass them here)
          echo "🚀 Restarting ${{ env.SERVICE_NAME }} via systemd..."
          timeout 60 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -i ec2-key.pem ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e

            echo "🔄 Reloading systemd (in case the unit file changed)..."
            sudo systemctl daemon-reload

            echo "🔁 Restarting employee-creator..."
            sudo systemctl restart employee-creator

            echo "⏳ Waiting for the service to settle..."
            sleep 5

            echo "🔍 Checking service status..."
            if sudo systemctl is-active --quiet employee-creator; then
              echo "✅ employee-creator is running"
              sudo systemctl status employee-creator --no-pager | head -10
            else
              echo "❌ employee-creator failed to start!"
              sudo journalctl -u employee-creator -n 50 --no-pager
              exit 1
            fi
          EOF

          # Clean up SSH key
          rm -f ec2-key.pem
