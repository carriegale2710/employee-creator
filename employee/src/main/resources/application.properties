# Load in secret access variables for PostgreSQL DB config (in project root)
spring.config.import=optional:file:application-secrets.properties

# dev vs default logging settings
spring.profiles.active=dev




# PostgreSQL DB config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true

# App name (optional)
spring.application.name=employee
