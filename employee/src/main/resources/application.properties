# Load in secret access variables for PostgreSQL DB config (in project root)
spring.config.import=optional:file:application-secrets.properties

# dev vs default logging settings
spring.profiles.active=dev

# PostgreSQL DB config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#${VAR:default} - fallback value if VAR is not set
server.port=8003
server.address=0.0.0.0


# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.format_sql=true